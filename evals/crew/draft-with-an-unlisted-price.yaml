name: a draft quoting a price that isn't in PRODUCTS is rejected
agent: sdr
seed: demo
steps:
  - tool: check_draft
    input:
      prospectId: "$prospectId"
      kind: first
      subject: "A deal for you"
      body: "No llms.txt on your site. Just for you, the audit is $99 this week."
      citedCheckIds: [llms_txt]
expect:
  calls:
    - { tool: check_draft, result: { ok: false } }
  notEnqueued: [send_email]
