# Render Blueprint: the Outrun worker (pg-boss consumers and cron). The web app is on Vercel.
# Secrets are sync: false, so Render asks for them when the Blueprint is applied; they never
# live in git.
services:
  - type: worker
    name: outrun-worker
    runtime: node
    plan: starter
    branch: main
    autoDeploy: true
    buildCommand: corepack enable && pnpm install --frozen-lockfile
    preDeployCommand: pnpm db:migrate
    startCommand: pnpm --filter @outrun/worker start
    buildFilter:
      paths:
        - apps/worker/**
        - packages/core/**
        - pnpm-lock.yaml
        - render.yaml
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22.12.0"
      - key: OUTRUN_DEMO
        value: "true"
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_URL_UNPOOLED
        sync: false
      - key: APP_URL
        sync: false
      - key: ALERT_EMAIL
        sync: false
      - key: NAIVE_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: MONID_API_KEY
        sync: false
      - key: AGENTMAIL_API_KEY
        sync: false
      - key: HUBSPOT_ACCESS_TOKEN
        sync: false
      - key: APIFY_TOKEN
        sync: false
